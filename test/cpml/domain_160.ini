; CPML reflection test: z-dipole, 1 fs Gaussian pulse at 800 nm, 20 nm cells, 8-cell CPML.
; domain_24 is the test, probes 4 cells from the CPML, domain_160 the reference, its own CPML
; reflections reach the probes only after the 300 steps. Run both, then check.py.
[grid]
nx = 160
ny = 160
nz = 160
dx = 20e-9
dy = 20e-9
dz = 20e-9
pml_x = 8
pml_y = 8
pml_z = 8
time_steps = 300
[boxes]
tfsf_x = 4
tfsf_y = 4
tfsf_z = 4
scattering_x = 2
scattering_y = 2
scattering_z = 2
absorption_x = 3
absorption_y = 3
absorption_z = 3
[source]
type = dipole
signal = gaussian

[signal.gaussian]
center_wavelength = 800e-9
width = 1e-15

[spectrum]
lambda_min = 800e-9
lambda_max = 800e-9
points = 1
[monitor.face]
type = time
center_x = 88
center_y = 80
center_z = 80
size_x = 1
size_y = 1
size_z = 1
[monitor.corner]
type = time
center_x = 88
center_y = 88
center_z = 88
size_x = 1
size_y = 1
size_z = 1

[dipole.center]
x = 80
y = 80
z = 80
e_x = 0
e_y = 0
e_z = 1
