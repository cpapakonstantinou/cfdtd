; Oblique Gaussian beam built from a plane-wave superposition, [plane_wave.*] below
; in an empty domain
[grid]
nx = 120
ny = 120
nz = 120
dx = 5e-9
dy = 5e-9
dz = 5e-9
pml_x = 20
pml_y = 20
pml_z = 20
time_steps = 1000

[parallel]
ranks_x = 2
ranks_y = 2
ranks_z = 2

[boxes]
tfsf_x = 20
tfsf_y = 20
tfsf_z = 40
scattering_x = 10
scattering_y = 10
scattering_z = 10
absorption_x = 30
absorption_y = 30
absorption_z = 50

[source]
type = wave_superposition
signal = gaussian

[wave_superposition]
derivative = false
dispersion_correction = true

[signal.gaussian]
center_wavelength = 160e-9
width = 15e-16

[spectrum]
lambda_min = 50e-9
lambda_max = 150e-9
points = 31

[output]
frames_xy = 40

[wave.0]
direction_x = -0.7071067811865476
direction_y = -0.7071067811865475
direction_z = 0.0
e_x = 0.0
e_y = 0.0
e_z = 1.0
h_x = -0.0018769574837210227
h_y = 0.001876957483721023
h_z = 0.0
