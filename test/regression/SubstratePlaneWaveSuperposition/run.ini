; Plane-wave superposition, [plane_wave.*] below, incident on a substrate with
; n = 1.5 as the last medium.
[grid]
nx = 120
ny = 120
nz = 120
dx = 5e-9
dy = 5e-9
dz = 5e-9
pml_x = 20
pml_y = 20
pml_z = 20
time_steps = 300

[parallel]
ranks_x = 2
ranks_y = 2
ranks_z = 2

[boxes]
tfsf_x = 20
tfsf_y = 20
tfsf_z = 40
scattering_x = 10
scattering_y = 10
scattering_z = 10
absorption_x = 30
absorption_y = 30
absorption_z = 50

[source]
type = wave_superposition

[wave_superposition]
derivative = false
dispersion_correction = false

[spectrum]
; the movie frames compared by the test do not depend on the DFT wavelength
lambda_min = 800e-9
lambda_max = 800e-9

[geometry]
last_medium = substrate

[output]
frames_xy = 40

[wave.0]
direction_x = 0.8660254037844387
direction_y = 0.49999999999999994
direction_z = 6.123233995736766e-17
e_x = 1.9409873999903063e-17
e_y = -9.485122789370993e-17
e_z = 0.5
h_x = 0.000663604682368987
h_y = -0.0011493970260036924
h_z = -2.438044050487128e-19

[wave.1]
direction_x = 0.0
direction_y = 1.0
direction_z = 0.0
e_x = 0.0
e_y = 0.0
e_z = 0.5
h_x = 0.0013272093647379742
h_y = 0.0
h_z = 0.0

[material.substrate]
model = dielectric
n = 1.5
