; Anapole regression case
; Plasmonic anapole nanoantenna, docs/geometry/Anapole.md: a 30 nm silver patch, Drude+2CP, material 101
; with the dumbbell aperture, in air on a glass substrate (n = 1.45), plane wave from the air side.
; 4 nm cells and a short run: this checks the shape, the layered TF/SF source and the Q integrals,
; it is not a converged spectrum.
[grid]
nx = 140
ny = 48
nz = 140
dx = 4e-9
dy = 4e-9
dz = 4e-9
pml_x = 8
pml_y = 8
pml_z = 8
time_steps = 1200
origin_x = 70
origin_y = 24
origin_z = 70

[parallel]
ranks_x = 2
ranks_y = 2
ranks_z = 2

[boxes]
tfsf_x = 10
tfsf_y = 6
tfsf_z = 10
scattering_x = 5
scattering_y = 3
scattering_z = 5
absorption_x = 14
absorption_y = 8
absorption_z = 14

[source]
allow_truncated_signal = true

[spectrum]
lambda_min = 800e-9
lambda_max = 1600e-9
points = 9

[geometry]
shape = anapole
material = silver_d2cp
first_medium = vacuum
last_medium = glass
shift_y = 15e-9

; the design scaled to a 400 nm patch
[anapole]
patch_edge = 400e-9
corner_radius = 22e-9

[output]
dft_xz = true

[material.glass]
model = dielectric
n = 1.45
