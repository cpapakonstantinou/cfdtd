; EmptyDomain with a Gaussian pulse
[grid]
nx = 80
ny = 120
nz = 80
dx = 1e-9
dy = 1e-9
dz = 1e-9
pml_x = 20
pml_y = 20
pml_z = 20
time_steps = 1000
origin_x = 40
origin_y = 60
origin_z = 40

[parallel]
ranks_x = 2
ranks_y = 2
ranks_z = 2

[boxes]
tfsf_x = 20
tfsf_y = 20
tfsf_z = 20
scattering_x = 10
scattering_y = 10
scattering_z = 10
absorption_x = 30
absorption_y = 30
absorption_z = 30

[source]
signal = gaussian
; the 80 fs pulse is longer than the run: a regression case, not a converged spectrum
allow_truncated_signal = true

[signal.gaussian]
center_wavelength = 528e-9
width = 80e-15

[spectrum]
lambda_min = 300e-9
lambda_max = 800e-9
points = 31

[geometry]
; was Antenna Type 1 with zero radius: no structure
shape = none

[output]
frames_xy = 15
