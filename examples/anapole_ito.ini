; The plasmonic anapole of examples/anapole.ini with the aperture filled by ITO.
; ITO is a Drude material whose plasma frequency follows its carrier_density; [material.ito] below
; extends the catalog fit ito_10p5_drude, eps_inf = 3.99 and a damping of 3.07e14 rad/s. At
; 1.054e27 m^-3 its permittivity
; falls from about 3.3 at 500 nm to zero near 1240 nm, so the fill is a dielectric at the anapole
; dip and approaches epsilon-near-zero at the long-wavelength resonance.
; See docs/geometry/Anapole.md and docs/models/Materials.md.
;
;   mpirun -n 8 ./fdtd mesh     examples/anapole_ito.ini -o out/anapole_ito     look at materials/ first
;   mpirun -n 8 ./fdtd simulate examples/anapole_ito.ini -o out/anapole_ito
;
; To fill the gap alone, set gap_material = ito and remove aperture_material.

[grid]
; 2 nm cells: the gap is 6 x 8 cells, the film 15 cells
dx = 2e-9
dy = 2e-9
dz = 2e-9
; 360 x 200 x 360 nm around the patch, the CPML is added on top
nx = 180
ny = 100
nz = 180
pml_x = 12
pml_y = 12
pml_z = 12
; 100 fs; the 985 nm resonance rings for tens of fs after the pulse, raise it until the spectra stop changing
time_steps = 30000

[parallel]
ranks_x = 2
ranks_y = 2
ranks_z = 2

[boxes]
; cells from the CPML: the TF/SF box is 280 x 120 x 280 nm around the 200 nm patch
tfsf_x = 20
tfsf_y = 20
tfsf_z = 20

[source]
type = plane_wave
signal = raised_cosine

[plane_wave]
propagation_axis = y
; E across the lobe axis drives the gap and gives the anapole state; x switches it off
polarization_axis = z

[signal.raised_cosine]
; covers 400 nm, 7.5e14 Hz, and longer
max_frequency = 1e15

[spectrum]
lambda_min = 400e-9
lambda_max = 1200e-9
; every 10 nm
points = 81

[geometry]
shape = anapole
; silver, Drude + 2 critical points
material = silver_d2cp

[anapole]
patch_edge = 200e-9
thickness = 30e-9
corner_radius = 11e-9
; the gap between the lobes: 12.04 nm along the lobe axis, 15.91 nm across it
gap_length = 12.0432e-9
gap_width = 15.914e-9
; the lobe curve, in units of patch_edge, fitted at 200 nm
lobe_length = 0.433641
lobe_height = 0.445090
lobe_exponent = 1.4098
lobe_offset = -0.120141
; degrees in the x-z plane; at 0 the lobes lie along x
rotation = 0
; ITO in the lobes and the gap
aperture_material = ito

[output]
; E in the plane of the patch at every wavelength
dft_xz = true

[multipoles]
; true adds the exact multipole decomposition, reports/Multipoles_exact_*. It keeps a DFT of the
; current in the whole domain at every wavelength: 37 GiB more with this grid and 81 wavelengths,
; and a run several times slower. Lower [spectrum] points before turning it on; fdtd memory tells the cost.
exact = false

; the field in the gap volume, 12 x 30 x 12 nm at the patch centre; positions in cells without the CPML
[monitor.gap]
type = frequency
center_x = 90
center_y = 50
center_z = 90
size_x = 6
size_y = 15
size_z = 6

; E(t) at the gap centre
[probe.gap]
x = 90
y = 50
z = 90

; the free carriers of the ITO, in m^-3
[material.ito]
extends = ito_10p5_drude
carrier_density = 1.054e27
