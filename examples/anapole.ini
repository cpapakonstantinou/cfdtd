; Plasmonic anapole, docs/geometry/Anapole.md: gold, Drude+2CP, material 100, patch in vacuum, 4 nm cells.
; mpirun -n 2 ./fdtd mesh examples/anapole.ini -o out/anapole   # inspect materials/MaterialIndex_XZ.h5 first
[grid]
nx = 140
ny = 40
nz = 140
dx = 4e-9
dy = 4e-9
dz = 4e-9
pml_x = 8
pml_y = 8
pml_z = 8
time_steps = 6000       ; 40 fs; the resonances ring longer than the pulse: raise it until the spectra stop changing
[boxes]
tfsf_x = 10
tfsf_y = 6
tfsf_z = 10
scattering_x = 5
scattering_y = 3
scattering_z = 5
absorption_x = 14
absorption_y = 8
absorption_z = 14
[spectrum]
lambda_min = 800e-9
lambda_max = 1600e-9
points = 3
[geometry]
shape = anapole
material = 100
[output]
dft_xz = true
