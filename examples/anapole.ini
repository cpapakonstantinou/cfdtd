; Plasmonic anapole meta-atom after Hassan et al., Laser Photonics Rev. 19, 2400118, 2025:
[grid]
dx = 2e-9
dy = 2e-9
dz = 2e-9
nx = 180
ny = 100
nz = 180
pml_x = 12
pml_y = 12
pml_z = 12
time_steps = 30000

[parallel]
ranks_x = 2
ranks_y = 2
ranks_z = 2

[boxes]
tfsf_x = 20
tfsf_y = 20
tfsf_z = 20

[source]
type = plane_wave
signal = raised_cosine

[plane_wave]
propagation_axis = y
; E across the lobe axis drives the gap and gives the anapole state
; x switches it off
polarization_axis = z

[signal.raised_cosine]
max_frequency = 1e15

[spectrum]
lambda_min = 400e-9
lambda_max = 1200e-9
points = 81

[geometry]
shape = anapole
; silver, Drude + 2 critical points
material = 101

[anapole]
patch_edge = 200e-9
thickness = 30e-9
corner_radius = 11e-9
gap_length = 12.0432e-9
gap_width = 15.914e-9
lobe_length = 0.433641
lobe_height = 0.445090
lobe_exponent = 1.4098
lobe_offset = -0.120141
rotation = 0
; fills, a material code; -1 leaves the background
aperture_material = -1
gap_material = -1

[output]
; E in the plane of the patch at every wavelength
dft_xz = true

[multipoles]
; true adds the exact multipole decomposition
exact = false

; the field in the gap volume, 12 x 30 x 12 nm at the patch centre; positions in cells without the CPML
[monitor.gap]
type = frequency
center_x = 90
center_y = 50
center_z = 90
size_x = 6
size_y = 15
size_z = 6

; E(t) at the gap centre
[probe.gap]
x = 90
y = 50
z = 90