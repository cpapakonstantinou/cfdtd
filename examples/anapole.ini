; Plasmonic anapole meta-atom after Hassan et al., Laser Photonics Rev. 19, 2400118, 2025:
; a 200 x 200 x 30 nm silver patch with a dumbbell aperture, in air, plane wave at normal incidence.
; In the paper the scattering cross section has peaks near 580 and 985 nm and the anapole dip near
; 735 nm. The fitted outline used here is red-shifted: about 640, 1060 and 800 nm with 2 nm cells.
; See docs/geometry/Anapole.md.
;
;   ./fdtd check  examples/anapole.ini                          validate, print the resolved keys
;   ./fdtd signal examples/anapole.ini                          signal length against time_steps
;   ./fdtd memory examples/anapole.ini                          memory per rank and in total
;   mpirun -n 8 ./fdtd mesh     examples/anapole.ini -o out/anapole     look at materials/ first
;   mpirun -n 8 ./fdtd simulate examples/anapole.ini -o out/anapole
;
; Results: reports/Qcoeff_* holds the scattering, absorption and extinction efficiencies,
; fields/E_<wl>nm_XZ.h5 the field in the plane of the patch, fields/E_DFT_gap_WL_<wl>nm.h5 the field
; in the gap volume, frames/TimePlot_* the probe trace.

[grid]
; 2 nm cells: the gap is 6 x 8 cells, the film 15 cells
dx = 2e-9
dy = 2e-9
dz = 2e-9
; 360 x 200 x 360 nm around the patch, the CPML is added on top
nx = 180
ny = 100
nz = 180
pml_x = 12
pml_y = 12
pml_z = 12
; 100 fs; the 985 nm resonance rings for tens of fs after the pulse, raise it until the spectra stop changing
time_steps = 30000

[parallel]
ranks_x = 2
ranks_y = 2
ranks_z = 2

[boxes]
; cells from the CPML: the TF/SF box is 280 x 120 x 280 nm around the 200 nm patch
tfsf_x = 20
tfsf_y = 20
tfsf_z = 20

[source]
type = plane_wave
signal = raised_cosine

[plane_wave]
propagation_axis = y
; E across the lobe axis drives the gap and gives the anapole state; x switches it off
polarization_axis = z

[signal.raised_cosine]
; covers 400 nm, 7.5e14 Hz, and longer
max_frequency = 1e15

[spectrum]
lambda_min = 400e-9
lambda_max = 1200e-9
; every 10 nm
points = 81

[geometry]
shape = anapole
; silver, Drude + 2 critical points
material = silver_d2cp

[anapole]
; every key with its default: the fit to the published design
patch_edge = 200e-9
thickness = 30e-9
corner_radius = 11e-9
; the gap between the lobes: 12.04 nm along the lobe axis, 15.91 nm across it
gap_length = 12.0432e-9
gap_width = 15.914e-9
; the lobe curve, in units of patch_edge, fitted at 200 nm
lobe_length = 0.433641
lobe_height = 0.445090
lobe_exponent = 1.4098
lobe_offset = -0.120141
; degrees in the x-z plane; at 0 the lobes lie along x
rotation = 0
; fills, a material code; -1 leaves the background

[output]
; E in the plane of the patch at every wavelength
dft_xz = true

[multipoles]
; true adds the exact multipole decomposition, reports/Multipoles_exact_*. It keeps a DFT of the
; current in the whole domain at every wavelength: 37 GiB more with this grid and 81 wavelengths,
; and a run several times slower. Lower [spectrum] points before turning it on; fdtd memory tells the cost.
exact = false

; the field in the gap volume, 12 x 30 x 12 nm at the patch centre; positions in cells without the CPML
[monitor.gap]
type = frequency
center_x = 90
center_y = 50
center_z = 90
size_x = 6
size_y = 15
size_z = 6

; E(t) at the gap centre
[probe.gap]
x = 90
y = 50
z = 90

; Variants, as overrides on the command line or edited above:
;
; fill the gap, or the whole aperture, with a dielectric of index 2:
;   -s anapole.gap_material=n2 -s material.n2.model=dielectric -s material.n2.n=2
;   -s anapole.aperture_material=n2 -s material.n2.model=dielectric -s material.n2.n=2
;
; fill the aperture with ITO: examples/anapole_ito.ini
;
; on a glass substrate, the film resting on the interface:
;   -s geometry.last_medium=glass -s material.glass.model=dielectric -s material.glass.n=1.45 -s geometry.shift_y=15e-9
;
; metasurface, pitch 280 nm, reflectance and transmittance in reports/ART_*:
;   -s grid.periodic_x=true -s grid.periodic_z=true -s grid.nx=140 -s grid.nz=140
;   -s monitor.gap.center_x=70 -s monitor.gap.center_z=70 -s probe.gap.x=70 -s probe.gap.z=70
;
; quick look at 4 nm cells, about 30 times cheaper:
;   -s grid.dx=4e-9 -s grid.dy=4e-9 -s grid.dz=4e-9 -s grid.nx=90 -s grid.ny=50 -s grid.nz=90
;   -s grid.time_steps=15000 -s boxes.tfsf_x=10 -s boxes.tfsf_y=10 -s boxes.tfsf_z=10
;   -s monitor.gap.center_x=45 -s monitor.gap.center_y=25 -s monitor.gap.center_z=45
;   -s monitor.gap.size_x=3 -s monitor.gap.size_y=8 -s monitor.gap.size_z=3
;   -s probe.gap.x=45 -s probe.gap.y=25 -s probe.gap.z=45
