; Plasmonic anapole after Hassan et al., Laser Photonics Rev. 19, 2400118, 2025
[grid]
dx = 1e-9
dy = 1e-9
dz = 1e-9
nx = 500
ny = 500
nz = 500
pml_x = 16
pml_y = 16
pml_z = 16
time_steps = 65000

[parallel]
ranks_x = 4
ranks_y = 4
ranks_z = 4

[boxes]
tfsf_x = 60
tfsf_y = 60
tfsf_z = 60

[source]
type = plane_wave
signal = gaussian
;peak_field = 8.68e7

[plane_wave]
propagation_axis = y
polarization_axis = z

[signal.gaussian]
; the anapole dip of Hassan et al.
center_wavelength = 735e-9
width = 20e-15

[spectrum]
lambda_min = 690e-9
lambda_max = 785e-9
;points = 5
;harmonic_band = third
;spacing = frequency

[geometry]
shape = anapole
material = silver_johnson_d2cp

[anapole]
patch_edge = 200e-9
thickness = 30e-9
corner_radius = 11e-9
gap_length = 12.0e-9
gap_width = 16.0e-9

[nonlinear]
thg = false
update = field

[output]
; harmonic and fundamental maps at every spectrum point
dft_xy = true
dft_xz = true
dft_yz = true
; frames every 100 steps: about 15 per period at 735 nm, 5 at 245 nm
frames_xy = 100
frames_xz = 100
frames_yz = 100

[probe.gap]
x = 250
y = 250
z = 250
