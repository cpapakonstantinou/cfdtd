; Plasmonic anapole after Hassan et al., Laser Photonics Rev. 19, 2400118, 2025: mesh 1 nm.
; Domain 500 x 500 x 500 nm without the CPML, TF/SF margin 60 nm, 100 fs.
; MPI ranks: 64.

[grid]
dx = 1e-9
dy = 1e-9
dz = 1e-9
nx = 500
ny = 500
nz = 500
pml_x = 16
pml_y = 16
pml_z = 16
time_steps = 60000

[parallel]
ranks_x = 4
ranks_y = 4
ranks_z = 4

[boxes]
tfsf_x = 60
tfsf_y = 60
tfsf_z = 60

[source]
type = plane_wave
signal = raised_cosine

[plane_wave]
propagation_axis = y
polarization_axis = z

[signal.raised_cosine]
max_frequency = 1e15

[spectrum]
lambda_min = 400e-9
lambda_max = 1200e-9
points = 81

[geometry]
shape = anapole
material = silver_johnson_d2cp

[anapole]
patch_edge = 200e-9
thickness = 30e-9
corner_radius = 11e-9
gap_length = 12.0e-9
gap_width = 16.0e-9

[multipoles]
; true adds the exact multipole decomposition
exact = false