; Gold dimer in glass, second-harmonic generation, exact multipoles.
[grid]
nx = 240
ny = 240
nz = 240
dx = 2e-9
dy = 2e-9
dz = 2e-9
time_steps = 60000

[parallel]
ranks_x = 2
ranks_y = 2
ranks_z = 2

[source]
type = plane_wave
signal = gaussian
peak_field = 1e8

[signal.gaussian]
center_wavelength = 800e-9
width = 30e-15

[spectrum]
lambda_min = 700e-9
lambda_max = 900e-9
points = 41
spacing = frequency
harmonic_band = second

[geometry]
shape = sphere_dimer
material = 4
first_medium = 2
middle_medium = 2
last_medium = 2

[sphere_dimer]
radius = 40e-9
spacing = 100e-9

[materials]
n2 = 1.45
n4 = 1.45

[nonlinear]
shg = antenna
update = polarization
chi_structure = antenna   ; the [chi2.antenna] section below; built-in presets need no section, BBO, LiNbO3, ...
; chi_first, chi_middle, chi_last unset: the media have no chi2

; d_mn in m/V (chi2 = 2 d); components not listed are zero
[chi2.antenna]
d11 = 1e-12
d22 = 1e-12
d33 = 1e-12

[multipoles]
exact = true

[output]
volume_dft = true

[probe.gap]
x = 120
y = 120
z = 120
