; Gold dimer in glass, second-harmonic generation, exact multipoles.
; mpirun -n 8 ./fdtd mesh     examples/dimer_shg.ini -o out/dimer   # qualify the mesh first
; mpirun -n 8 ./fdtd simulate examples/dimer_shg.ini -o out/dimer

[grid]
nx = 240
ny = 240
nz = 240
dx = 2e-9
dy = 2e-9
dz = 2e-9
time_steps = 60000            ; the pulse must end well inside the run: ./sigcfg shows the pump floor at 2w per step count

[parallel]
ranks_x = 2
ranks_y = 2
ranks_z = 2

[source]
type = plane_wave
signal = gaussian
peak_field = 1e8

[signal.gaussian]
center_wavelength = 800e-9
width = 30e-15

[spectrum]
lambda_min = 700e-9
lambda_max = 900e-9
points = 41
spacing = frequency
harmonic_band = second        ; adds 41 points at 2w -- nothing else changes

[geometry]                    ; the materials below are placeholders -- use your own
shape = sphere_dimer
material = crystal
first_medium = glass
middle_medium = glass
last_medium = glass

[sphere_dimer]
radius = 40e-9
spacing = 100e-9

[nonlinear]
shg = true                    ; every material with a chi2 tensor; the glass has none
update = polarization

[material.glass]
model = dielectric
n = 1.45

[material.crystal]
extends = glass
chi2 = crystal

; d_mn in m/V (chi2 = 2 d); components not listed are zero
[chi2.crystal]
d11 = 1e-12
d22 = 1e-12
d33 = 1e-12

[multipoles]
exact = true

[output]
volume_dft = true

[probe.gap]
x = 120
y = 120
z = 120

