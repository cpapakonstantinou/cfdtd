; Mode source, worked example, docs/sources/ModeSource.md: the TE mode of a 1 um x 400 nm Si3N4
; strip in SiO2, injected along +x at 1550 nm. The strip is a [block] that runs through the PML.
;
;   1. python strip_mode.py             MPB: writes strip-e.k01.b01.h5, strip-h.k01.b01.h5, prints n_eff
;   2. set [mode] effective_index to the printed value
;   3. mpirun -n 4 ./fdtd simulate examples/mode_source/waveguide.ini -i examples/mode_source -o out/waveguide
;
; Check: fields/E_1550nm_XY.h5, side view through the strip, shows the mode downstream of x = -2.4 um
; and nothing upstream, about -46 dB of the forward power, from the mismatch of the MPB and FDTD grids.

[grid]
nx = 200                ; 8 um along the strip
ny = 50                 ; 2 um high
nz = 60                 ; 2.4 um wide
dx = 40e-9              ; coarse: 10 cells across the strip height; 20 nm for production
dy = 40e-9
dz = 40e-9
pml_x = 10
pml_y = 10
pml_z = 10
time_steps = 1500       ; sigcfg: the pulse needs about 560 steps, plus two transits of the strip

[parallel]
ranks_x = 4

[spectrum]
lambda_min = 1.5e-6
lambda_max = 1.6e-6
points = 3

[source]
type = mode
signal = gaussian

[signal.gaussian]
center_wavelength = 1.55e-6
width = 8e-15

[mode]
efield = strip-e.k01.b01.h5
hfield = strip-h.k01.b01.h5
unit_length = 1e-6      ; MPB's a
effective_index = 1.652 ; from strip_mode.py
propagation_axis = x
position = -2.4e-6      ; injection plane, from the structure centre, the middle of the domain

[geometry]
shape = none
first_medium = 1        ; SiO2 everywhere ...
middle_medium = 1
last_medium = 1

[block.strip]           ; ... and the strip, along x through the whole domain
material = 2
y_min = -200e-9
y_max = 200e-9
z_min = -500e-9
z_max = 500e-9

[materials]
n1 = 1.444              ; SiO2 at 1550 nm
n2 = 2.0                ; Si3N4

[output]
dft_xy = true           ; side view: x along the strip, y up
dft_yz = true           ; cross-section at the structure centre
