; Gold dipole antenna fed by a Si3N4 grating coupler, docs/sources/ModeSource.md, worked example 2.
;
;   side view (x along the waveguide, y up; the antenna is at x = 0, the structure centre):
;
;        air                          [dipole] (gold), on the cladding
;   ---------------------------------------------------------------  y = 200 nm + cladding
;        SiO2 cladding (adjustable)      ^ emitted beam
;   ====== input waveguide ======| |  | |  | |  | |  ...  Si3N4 400 nm, y = -200 .. 200 nm
;        SiO2 box, 3 um
;   ---------------------------------------------------------------  y = -3.2 um
;        Si handle (through the PML)
;
; The TE mode of the 3 um wide input waveguide, from MPB, is injected along +x at x = -5 um. The fully
; etched grating, period 1.15 um, half filled, sends it up at about 10 degrees in SiO2; the antenna sits
; on the cladding above the third period.
;
;   1. python waveguide_mode.py        MPB: waveguide-e.k01.b01.h5, waveguide-h.k01.b01.h5, n_eff
;   2. set [mode] effective_index to the printed value
;   3. sigcfg grating_antenna.ini       steps for the pulse; the grating and the antenna ring longer
;   4. mpirun -n 64 ./fdtd simulate examples/grating_antenna/grating_antenna.ini -i examples/grating_antenna -o out/grating
;
; Cladding height: two keys move together. For a cladding of h above the Si3N4:
;   [block.oxide] y_max = 200e-9 + h        [geometry] shift_y = -(200e-9 + h + 20e-9)
; shift_y moves the antenna towards -y, so the negative value raises it; 20 nm is half its thickness.
;
; Grating period: 1.15 um is a first estimate from sin(theta) = (n_B - lambda / period) / n_SiO2 with
; n_B ~ 1.59 for the half-filled grating, not an optimised design. Sweep it with both tooth keys, e.g.
;   -s block.teeth.pitch_x=1.10e-6 -s block.teeth.x_max=-2.375e-6    (x_max = x_min + period / 2)
;
; Grid: 20 nm cells give 575 x 295 x 250 = 42 M cells, about 10 GB. The antenna is 2 to 3 cells thick
; and wide at 20 nm: use 10 nm cells, dx = dy = dz = 10e-9, all cell counts and origins doubled,
; 340 M cells, for antenna spectra.

[grid]
nx = 575                ; x from -5.5 to 6.0 um
ny = 295                ; y from -3.7 to 2.2 um
nz = 250                ; z from -2.5 to 2.5 um
dx = 20e-9
dy = 20e-9
dz = 20e-9
origin_x = 275          ; the antenna, 5.5 um from the input end
origin_y = 185          ; the middle of the Si3N4, 3.7 um above the bottom
origin_z = -1           ; centre
pml_x = 12
pml_y = 12
pml_z = 12
time_steps = 12000      ; check with sigcfg

[spectrum]
lambda_min = 1.45e-6
lambda_max = 1.65e-6
points = 21

[source]
type = mode
signal = gaussian
peak_field = 1

[signal.gaussian]
center_wavelength = 1.55e-6
width = 15e-15

[mode]
efield = waveguide-e.k01.b01.h5
hfield = waveguide-h.k01.b01.h5
unit_length = 1e-6
effective_index = 1.75  ; replace with the value waveguide_mode.py prints
propagation_axis = x    ; MPB's x, the width, along z, MPB's y, the height, along y: the defaults
position = -5e-6        ; in the input waveguide, 0.5 um inside the PML edge

; the layer stack, drawn in this order, a later block overwrites an earlier one

[block.handle]          ; Si below the box, through the bottom PML
material = silicon
y_max = -3.2e-6

[block.oxide]           ; 3 um box + cladding: SiO2 from the handle up to the cladding top
material = silica
y_min = -3.2e-6
y_max = 1.2e-6          ; 200 nm + cladding height, here 1 um

[block.waveguide]       ; input waveguide, through the PML on the input side
material = silicon_nitride
x_max = -3.5e-6         ; the grating starts here
y_min = -200e-9
y_max = 200e-9
z_min = -1.5e-6
z_max = 1.5e-6

[block.teeth]           ; fully etched grating: 8 teeth of 575 nm every 1.15 um, after a 575 nm gap
material = silicon_nitride
x_min = -2.925e-6
x_max = -2.35e-6
y_min = -200e-9
y_max = 200e-9
z_min = -1.5e-6
z_max = 1.5e-6
count = 8
pitch_x = 1.15e-6

; the antenna, drawn last

[geometry]
shape = dipole
material = gold_d2cp          ; gold, Drude + 2 critical points
shift_y = -1.22e-6      ; on the cladding: -(200 nm + cladding + half the antenna thickness)

[dipole]                ; arms along z, across the waveguide: parallel to the TE field
width = 60e-9
thickness = 40e-9
gap = 40e-9
top_end = 260e-9
bottom_end = 260e-9

[output]
dft_xy = true           ; side view at z = 0, through the antenna gap: guide, grating, emitted beam
dft_xz = true           ; top view, at the Si3N4 for this shape
dft_yz = true           ; cross-section through the antenna

[monitor.gap]           ; spectrum in the antenna gap [cells]
type = frequency
center_x = 275
center_y = 246          ; origin_y + 1.22 um / 20 nm
center_z = 125
size_x = 4
size_y = 2
size_z = 2

[material.silicon]
model = dielectric
n = 3.476

[material.silica]
model = dielectric
n = 1.444

[material.silicon_nitride]
model = dielectric
n = 2.0
