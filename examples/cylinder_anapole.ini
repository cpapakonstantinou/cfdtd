; quasistatic anapole
[grid]
dx = 2e-9
dy = 2e-9
dz = 2e-9
nx = 200
ny = 200
nz = 200
pml_x = 16
pml_y = 16
pml_z = 16
time_steps = 30000

[parallel]
ranks_x = 4
ranks_y = 4
ranks_z = 4

[boxes]
tfsf_x = 20
tfsf_y = 20
tfsf_z = 20

[source]
type = plane_wave
signal = gaussian
peak_field = 2.287e8 

[plane_wave]
propagation_axis = y
polarization_axis = z

[signal.gaussian]
center_wavelength = 1.26e-6
width = 20e-15

[spectrum]
lambda_min = 1.21e-6
lambda_max = 1.31e-6
points = 11
harmonic_band = third
spacing = frequency

[geometry]
shape = cylinder_shell
material = ito_isotropic
shell_material = si3n4_isotropic
first_medium = host
middle_medium = host
last_medium = host

[material.host]
model = dielectric
n = 1.44

[cylinder_shell]
radius_core = 0.0575e-6
radius_shell = 0.1e-6
core_length = 100e-9
shell_length = 110e-9

[output]
dft_xy = true
dft_xz = true
dft_yz = true
frames_xy = 40
frames_xz = 40
frames_yz = 40


[probe.center]
x = 100
y = 100
z = 100

[multipoles]
exact = true

[material.ito_isotropic]
extends = ito_d2cp
chi3 = ito_isotropic

[material.si3n4_isotropic]
extends = si3n4_luke_mlorentz
chi3 = si3n4_isotropic

[nonlinear]
thg = true
update = polarization

